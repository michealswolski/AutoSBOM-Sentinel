[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autosbom-sentinel"
version = "0.1.0"
description = "Automotive-aware SBOM generation, VEX false-positive reduction, and runtime drift detection (personal portfolio project)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["sbom", "cyclonedx", "spdx", "vex", "automotive", "firmware", "supply-chain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# Zero runtime dependencies by design: everything runs on a stock Python 3.9+
# install (including a Raspberry Pi). External tools (syft, trivy, binwalk,
# cosign) are invoked as subprocesses when present and reported as missing
# when not. PyYAML is optional (device-context files may be JSON instead).
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7.4", "PyYAML>=6.0"]

[project.scripts]
autosbom = "autosbom.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autosbom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
