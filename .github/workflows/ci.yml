name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: CLI smoke test
        run: |
          autosbom --version
          autosbom benchmark \
            --ground-truth tests/fixtures/ground_truth.spdx.json \
            --tool-output syft=tests/fixtures/syft_output.json \
            --target-name ci-smoke
